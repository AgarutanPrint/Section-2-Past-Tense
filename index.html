    state.view = "menu";
    var html = '<div class="brand">Agarutan Print</div>';
    html += '<div class="quiz-title">Section 2: Past Tense Master!</div>';
    html += '<div class="quiz-sub">Yesterday &amp; Back Then! Simple Past + Past Continuous</div>';

    SECTIONS.forEach(function(sec, idx) {
      if (sec.isMastery) return;
      html += '<button class="section-btn" data-idx="' + idx + '">' +
        '<span class="dot" style="background:' + sec.color + '"></span>' +
        '<span class="emoji">' + sec.emoji + '</span>' +
        '<span>' + sec.title + '</span>' +
        '</button>';
    });

    var masteryIdx = SECTIONS.findIndex(function(s){ return s.isMastery; });
    html += '<button class="mastery-btn" data-idx="' + masteryIdx + '">🏆 Mastery Test</button>';

    root.innerHTML = html;

    var btns = root.querySelectorAll(".section-btn, .mastery-btn");
    btns.forEach(function(btn) {
      btn.addEventListener("click", function() {
        var idx = parseInt(btn.getAttribute("data-idx"), 10);
        startSection(idx);
      });
    });
  }

  function startSection(idx) {
    state.sectionIndex = idx;
    state.qIndex = 0;
    state.points = 0;
    state.correct = 0;
    state.wrong = 0;
    var sec = SECTIONS[idx];
    state.shuffledQuestions = shuffle(sec.questions).map(function(q) {
      return {
        q: q.q,
        hint: q.hint,
        answer: q.answer,
        options: shuffle(q.options)
      };
    });
    state.totalQuestions = state.shuffledQuestions.length;
    state.view = "quiz";
    renderQuestion();
  }

  // ---------- QUIZ ----------
  function renderQuestion() {
    state.answered = false;
    state.hintUsed = false;
    var sec = SECTIONS[state.sectionIndex];
    var qData = state.shuffledQuestions[state.qIndex];
    var scorePct = state.totalQuestions ? Math.round((state.correct / (state.correct + state.wrong || 1)) * 100) : 0;

    var html = '';
    html += '<div class="quiz-header">' +
      '<div class="section-heading"><span class="dot" style="background:' + sec.color + '"></span>' +
      '<span>' + sec.emoji + ' ' + sec.title + '</span></div>' +
      '<button class="exit-btn" id="exit-btn">Exit</button>' +
      '</div>';

    html += '<div class="stats-bar">' +
      '<span>⭐ ' + state.points + '</span>' +
      '<span>✅ ' + state.correct + '</span>' +
      '<span>❌ ' + state.wrong + '</span>' +
      '<span>🎯 ' + calcScorePct() + '%</span>' +
      '</div>';

    var progressPct = Math.round((state.qIndex / state.totalQuestions) * 100);
    html += '<div class="progress-track"><div class="progress-fill" style="width:' + progressPct + '%;background:' + sec.color + '"></div></div>';

    html += '<div class="question-text">Q' + (state.qIndex + 1) + ' of ' + state.totalQuestions + ': ' + qData.q + '</div>';

    html += '<button class="hint-btn" id="hint-btn">💡 Hint</button>';
    html += '<div class="hint-text hidden" id="hint-text">' + qData.hint + '</div>';

    qData.options.forEach(function(opt, i) {
      html += '<button class="option-btn" data-opt="' + i + '">' + opt + '</button>';
    });

    html += '<div class="feedback-banner" id="feedback-banner"></div>';
    html += '<button class="next-btn" id="next-btn" style="background:' + sec.color + '">Next</button>';

    root.innerHTML = html;

    document.getElementById("exit-btn").addEventListener("click", renderMenu);
    document.getElementById("hint-btn").addEventListener("click", function() {
      document.getElementById("hint-text").classList.remove("hidden");
      state.hintUsed = true;
    });

    var optionBtns = root.querySelectorAll(".option-btn");
    optionBtns.forEach(function(btn) {
      btn.addEventListener("click", function() {
        if (state.answered) return;
        state.answered = true;
        var chosen = qData.options[parseInt(btn.getAttribute("data-opt"), 10)];
        var isCorrect = chosen === qData.answer;
        optionBtns.forEach(function(b) {
          b.disabled = true;
          var val = qData.options[parseInt(b.getAttribute("data-opt"), 10)];
          if (val === qData.answer) b.classList.add("correct");
          else if (b === btn) b.classList.add("wrong");
        });
        var feedback = document.getElementById("feedback-banner");
        if (isCorrect) {
          state.correct++;
          state.points += state.hintUsed ? 5 : 10;
          feedback.className = "feedback-banner correct";
          feedback.textContent = "✅ Great job! That's correct!";
        } else {
          state.wrong++;
          feedback.className = "feedback-banner wrong";
          feedback.textContent = "❌ Not quite. The correct answer is: " + qData.answer;
        }
        var nextBtn = document.getElementById("next-btn");
        nextBtn.classList.add("show");
        nextBtn.textContent = (state.qIndex === state.totalQuestions - 1) ? "See Results" : "Next";
        nextBtn.addEventListener("click", function handler() {
          nextBtn.removeEventListener("click", handler);
          if (state.qIndex < state.totalQuestions - 1) {
            state.qIndex++;
            renderQuestion();
          } else {
            renderEndScreen();
          }
        });
      });
    });
  }

  function calcScorePct() {
    var total = state.correct + state.wrong;
    if (total === 0) return 0;
    return Math.round((state.correct / total) * 100);
  }

  // ---------- END SCREEN ----------
  function renderEndScreen() {
    var sec = SECTIONS[state.sectionIndex];
    var pct = calcScorePct();
    var html = '<div class="end-wrap">';

    if (pct >= 70) {
      var tier = pct === 100 ? "🏆 Spectacular" : (pct >= 85 ? "⭐ Excellent" : "🌟 Great Job");
      html += '<div class="trophy">🏆</div>';
      html += '<div class="tier-title">' + tier + '</div>';
      html += '<div class="stars">';
      for (var i = 0; i < 5; i++) {
        html += '<span class="star-pop" style="animation-delay:' + (i * 0.12) + 's">⭐</span>';
      }
      html += '</div>';
      html += '<div class="pills">' +
        '<span class="pill">⭐ ' + state.points + ' pts</span>' +
        '<span class="pill">✅ ' + state.correct + ' correct</span>' +
        '<span class="pill">❌ ' + state.wrong + ' wrong</span>' +
        '<span class="pill">🎯 ' + pct + '%</span>' +
        '</div>';

      if (sec.isMastery) {
        html += renderReviewBox();
      }
    } else {
      html += '<div class="encourage-emoji">💪</div>';
      html += '<div class="tier-title">Keep Practicing!</div>';
      html += '<div class="pills">' +
        '<span class="pill">⭐ ' + state.points + ' pts</span>' +
        '<span class="pill">✅ ' + state.correct + ' correct</span>' +
        '<span class="pill">❌ ' + state.wrong + ' wrong</span>' +
        '<span class="pill">🎯 ' + pct + '%</span>' +
        '</div>';
    }

    html += '<div class="end-actions">' +
      '<button class="btn-try" id="try-again">Try Again</button>' +
      '<button class="btn-menu" id="back-menu">Menu</button>' +
      '</div>';
    html += '</div>';

    root.innerHTML = html;

    document.getElementById("try-again").addEventListener("click", function() {
      startSection(state.sectionIndex);
    });
    document.getElementById("back-menu").addEventListener("click", renderMenu);
  }

  function renderReviewBox() {
    var src = getUrlParam("src");
    if (!src) return "";

    var etsyUrl = "https://www.etsy.com/your/purchases";
    var paperbackAsin = "";
    var hardcoverAsin = "";

    var buttons = "";
    if (src === "etsy") {
      buttons += '<a class="review-btn" href="' + etsyUrl + '" target="_blank" rel="noopener">Leave a Review on Etsy</a>';
    } else if (src === "amazon") {
      if (paperbackAsin) {
        buttons += '<a class="review-btn" href="https://www.amazon.com/review/create-review?asin=' + paperbackAsin + '" target="_blank" rel="noopener">Review the Paperback</a>';
      }
      if (hardcoverAsin) {
        buttons += '<a class="review-btn" href="https://www.amazon.com/review/create-review?asin=' + hardcoverAsin + '" target="_blank" rel="noopener">Review the Hardcover</a>';
      }
    }

    if (!buttons) return "";

    var html = '<div class="review-box">' +
      '<div class="review-lock">🔒 Notice: For Parents &amp; Educators</div>' +
      '<div class="review-q">How did you like this complete resource bundle?</div>' +
      '<div class="review-p">Thank you for choosing Agarutan Print! We hope this combination of printable worksheets, the digital fillable PDF, and the interactive quiz bonus is helping to build your student\'s skills.</div>' +
      '<div class="review-p">If this comprehensive resource bundle added value to your student\'s learning experience, please take a brief moment to share your feedback. Your review helps us continue creating high-quality learning assets!</div>' +
      buttons +
      '</div>';
    return html;
  }

  renderMenu();
})();
</script>
</body>
</html>
